# 仅手动触发（workflow_dispatch），避免与官方 build.yml（push 触发）重复构建。
# 用途：在官方 espressif/idf:v6.1 镜像里只编译 AI Passport 单板，并上传固件 + 定制表情包。
name: Build AI Passport (custom)

on:
  workflow_dispatch:
    inputs:
      board_id:
        description: "build.py 使用的板型 ID（与 --list-boards 一致）"
        required: false
        default: "folotoy/ai-passport"
      build_name:
        description: "config.json 中的 build.name"
        required: false
        default: "ai-passport"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware (single board)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "${{ inputs.board_id }}" --name "${{ inputs.build_name }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-firmware
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Upload custom emoji assets
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-assets
          path: main/boards/folotoy/ai-passport/assets_64_rounded.bin
          if-no-files-found: error
